name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and format
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The solution has no global.json, so the SDK is pinned here to the target framework
      # of every project. Without the pin the runner picks whatever preview SDK it ships with.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release

      - name: Verify formatting
        run: dotnet format --verify-no-changes
