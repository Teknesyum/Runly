name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and format
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The solution has no global.json, so the SDK is pinned here to the target framework
      # of every project. Without the pin the runner picks whatever preview SDK it ships with.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release

      - name: Verify formatting
        run: dotnet format --verify-no-changes

  readme:
    name: README translations stay in step
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Structural drift only: the two files must carry the same heading levels in the same
      # order. This says nothing about whether the prose behind a heading was translated.
      - name: Compare heading structure
        run: |
          levels() { grep -E '^#{1,6} ' "$1" | sed -E 's/^(#+) .*/\1/'; }
          if ! diff <(levels README.md) <(levels README.tr.md); then
            echo "::error file=README.tr.md::README.md and README.tr.md no longer share the same heading structure."
            exit 1
          fi
          echo "Heading structure matches: $(levels README.md | wc -l) headings."
